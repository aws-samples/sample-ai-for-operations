[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-flow-insight"
version = "0.1.1"
description = "Evidence-backed traffic map of an AWS estate from VPC Flow Logs in Amazon S3, queried through Amazon Athena."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
dependencies = [
  "boto3>=1.35",
  "mcp>=1.2",
  "sqlglot>=25",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pyarrow>=15",
]

[project.optional-dependencies]
cli = ["strands-agents>=1.0"]
hosted = ["strands-agents>=1.0", "bedrock-agentcore>=0.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "duckdb>=1.0", "bandit>=1.7"]

[project.scripts]
nfi = "network_flow_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_flow_insight = ["prompts/*.md", "data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "E501"]  # asserts in tests; SQL is built from validated identifiers and then passes sqlsafe

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
